<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24 фильма для изучения английского</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Crimson+Text:ital,wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0f;
      --surface:    #121218;
      --surface2:   #1a1a24;
      --gold:       #c9a84c;
      --gold-light: #e8c96a;
      --text:       #f0ece0;
      --muted:      #8a8070;
      --red:        #e05252;
      --green:      #52a882;
      --amber:      #d4953a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Шапка сайта */
    header {
      text-align: center;
      padding: 4rem 2rem 3rem;
    }

    .header-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
      opacity: 0.85;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 1.2rem;
    }

    header h1 em { font-style: italic; color: var(--gold-light); }

    header p {
      font-family: 'Crimson Text', serif;
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* Подсказки цветов (Легенда) */
    .legend {
      display: flex; justify-content: center; gap: 1.8rem;
      padding: 1.4rem 2rem;
      flex-wrap: wrap;
    }

    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-a { background: var(--green); }
    .dot-b { background: var(--amber); }
    .dot-c { background: var(--red); }

    /* Кнопки фильтрации */
    .filters {
      display: flex; justify-content: center; gap: 10px;
      padding: 1.5rem 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--muted);
      border-radius: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.07);
    }

    /* Сетка с карточками */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 2rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .card {
      cursor: pointer;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 2/3;
      transition: transform 0.2s;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .card-poster {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 16px 14px;
      position: relative;
      background-size: cover;
      background-position: center;
      background-color: var(--surface2); /* Заглушка, пока грузится фото */
    }

    .card-poster::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 100%);
    }

    .card-num {
      position: absolute; top: 12px; left: 14px;
      font-family: 'Playfair Display', serif;
      font-size: 11px; font-weight: 700;
      color: rgba(255,255,255,0.35);
      z-index: 2;
    }

    .card-difficulty {
      position: absolute; top: 10px; right: 10px;
      width: 10px; height: 10px; border-radius: 50%;
      z-index: 2;
    }

    .card-watched {
      position: absolute; bottom: 10px; right: 10px;
      font-size: 16px; z-index: 3;
      color: var(--green);
      display: none;
    }
    
    .card.watched .card-watched { display: block; }
    .card.watched { opacity: 0.4; }
    .card.watched:hover { opacity: 0.8; }

    .card-info { position: relative; z-index: 2; }
    .card-year { font-size: 11px; color: rgba(255,255,255,0.45); margin-bottom: 4px; }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px; font-weight: 700;
      line-height: 1.25; color: #fff;
      margin-bottom: 8px;
    }

    .card-level-tag {
      display: inline-block;
      font-size: 10px; letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px; border-radius: 3px;
      font-weight: 500;
    }

    .level-beginner     { background: rgba(82,168,130,0.2); color: #7ddaaa; }
    .level-intermediate { background: rgba(212,149,58,0.2);  color: #f0b96a; }
    .level-advanced     { background: rgba(224,82,82,0.2);   color: #f08080; }

    /* Модальное окно */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(5,5,10,0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 14px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-inner { display: flex; }

    .modal-poster-col {
      width: 200px; flex-shrink: 0;
      border-radius: 14px 0 0 14px;
      overflow: hidden;
    }

    .modal-poster-fill {
      width: 100%; height: 100%;
      min-height: 280px;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 20px 16px;
      position: relative;
      background-size: cover;
      background-position: center;
      background-color: var(--surface2);
    }

    .modal-poster-fill::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
    }

    .modal-poster-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-weight: 900;
      color: #fff; position: relative; z-index: 2;
    }

    .modal-poster-year {
      font-size: 12px; color: rgba(255,255,255,0.5);
      position: relative; z-index: 2;
      margin-top: 4px;
    }

    .modal-content { padding: 28px 28px 24px; flex: 1; }

    .modal-close {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.08);
      border: none; color: var(--muted);
      width: 30px; height: 30px;
      border-radius: 50%; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: rgba(255,255,255,0.15); color: var(--text); }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem; font-weight: 700;
      color: var(--text); margin-bottom: 4px;
    }

    .modal-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .modal-year-tag { font-size: 12px; color: var(--muted); }
    .modal-divider  { width: 1px; height: 12px; background: rgba(255,255,255,0.15); }

    .modal-desc {
      font-family: 'Crimson Text', serif;
      font-size: 1.05rem; color: rgba(240,236,224,0.8);
      line-height: 1.75; margin-bottom: 16px;
    }

    .modal-english-tip {
      background: var(--surface2);
      border-left: 2px solid var(--gold);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px; color: var(--muted);
      margin-bottom: 12px;
    }
    .modal-english-tip strong { color: var(--gold-light); font-weight: 500; }

    /* Стиль для нового блока предупреждения */
    .modal-warn-tip {
      background: rgba(224, 82, 82, 0.1);
      border-left: 2px solid var(--red);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
      color: #f08080;
      margin-bottom: 20px;
    }

    .modal-btn-watched {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--muted);
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .modal-btn-watched:hover { border-color: var(--gold); color: var(--gold); }
    .modal-btn-watched.active { background: rgba(82,168,130,0.15); border-color: var(--green); color: #7ddaaa; }

    /* Секция с плеером видео */
    .modal-video-section {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid rgba(201,168,76,0.15);
    }
    .modal-video-section.visible { display: block; }

    .modal-video-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin: 16px 0 10px;
      font-weight: 500;
    }

    .modal-video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .modal-video-wrapper iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 2.5rem 2rem;
      color: var(--muted);
      font-size: 13px;
      margin-top: 2rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 540px) {
      .modal-inner { flex-direction: column; }
      .modal-poster-col { width: 100%; border-radius: 14px 14px 0 0; }
      .modal-poster-fill { min-height: 180px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <p class="header-eyebrow">Кинотека</p>
    <h1>24 фильма для<br>изучения <em>английского</em></h1>
    <p>Смотри кино — учи язык. Каждый фильм подобран по уровню сложности речи, словарного запаса и произношения.</p>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="dot dot-a"></span> Начинающий</div>
    <div class="legend-item"><span class="dot dot-b"></span> Средний</div>
    <div class="legend-item"><span class="dot dot-c"></span> Продвинутый</div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterCards('all', this)">Все фильмы</button>
    <button class="filter-btn" onclick="filterCards('beginner', this)">Начинающий</button>
    <button class="filter-btn" onclick="filterCards('intermediate', this)">Средний</button>
    <button class="filter-btn" onclick="filterCards('advanced', this)">Продвинутый</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Бельский Владислав 10И · Разработано для школьного проекта</footer>

  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeModal(null)">×</button>

      <div class="modal-inner">
        <div class="modal-poster-col">
          <div class="modal-poster-fill" id="modal-poster">
            <div class="modal-poster-title" id="modal-poster-title"></div>
            <div class="modal-poster-year"  id="modal-poster-year"></div>
          </div>
        </div>

        <div class="modal-content">
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-meta">
            <span class="modal-year-tag" id="modal-year"></span>
            <div class="modal-divider"></div>
            <span id="modal-level-tag"></span>
          </div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-english-tip" id="modal-tip"></div>
          <div id="modal-warn"></div> 
          <button class="modal-btn-watched" id="modal-watched-btn" onclick="toggleWatched()">☐ Отметить просмотренным</button>
        </div>
      </div>

      <div class="modal-video-section" id="modal-video-section">
        <div class="modal-video-label">▶ Смотреть фильм</div>
        <div class="modal-video-wrapper">
          <iframe id="modal-video-iframe" src="" allowfullscreen></iframe>
        </div>
      </div>

    </div>
  </div>

  let currentMovieId = null;

  // План Б: Функция генерирует inline-стиль и страхует на случай ошибки загрузки по URL
  function setPosterWithFallback(elementId, movie, isModal = false) {
    const element = document.getElementById(elementId);
    if (!element) return;

    // Устанавливаем основную ссылку
    element.style.backgroundImage = "url('" + movie.poster + "')";

    // Создаем невидимый объект изображения для проверки ссылки на валидность
    const imgTester = new Image();
    imgTester.src = movie.poster;
    
    imgTester.onerror = function() {
      // Если URL-ссылка не загрузилась, переключаемся на локальный запасной файл
      element.style.backgroundImage = "url('" + movie.fallbackPoster + "')";
    };
  }

  function renderCards() {
    const gridElement = document.getElementById("grid");
    let fullHtml = "";

    for (let i = 0; i < movies.length; i++) {
      const m = movies[i];
      let watchedClass = m.isWatched === true ? " watched" : "";

      let dotColor = "var(--green)";
      let levelClass = "level-beginner";
      if (m.level === "intermediate") {
        dotColor = "var(--amber)";
        levelClass = "level-intermediate";
      } else if (m.level === "advanced") {
        dotColor = "var(--red)";
        levelClass = "level-advanced";
      }

      let displayId = m.id < 10 ? "0" + m.id : m.id;

      // ID для каждого блока обложки, чтобы потом применить fallback
      let posterBlockId = "card-poster-" + m.id;

      fullHtml += '<div class="card' + watchedClass + '" data-level="' + m.level + '" onclick="openModal(' + m.id + ')">';
      fullHtml += '  <div class="card-poster" id="' + posterBlockId + '">';
      fullHtml += '    <div class="card-num">' + displayId + '</div>';
      fullHtml += '    <div class="card-difficulty" style="background:' + dotColor + ';"></div>';
      fullHtml += '    <div class="card-watched">✓</div>';
      fullHtml += '    <div class="card-info">';
      fullHtml += '      <div class="card-year">' + m.year + '</div>';
      fullHtml += '      <div class="card-title">' + m.title + '</div>';
      fullHtml += '      <span class="card-level-tag ' + levelClass + '">' + m.levelRu + '</span>';
      fullHtml += '    </div>';
      fullHtml += '  </div>';
      fullHtml += '</div>';
    }

    gridElement.innerHTML = fullHtml;

    // После вставки HTML запускаем проверку картинок для каждой карточки
    for (let i = 0; i < movies.length; i++) {
      setPosterWithFallback("card-poster-" + movies[i].id, movies[i]);
    }
  }

  function filterCards(level, clickedButton) {
    const buttons = document.querySelectorAll(".filter-btn");
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove("active");
    }
    clickedButton.classList.add("active");

    const cards = document.querySelectorAll(".card");
    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const cardLevel = card.getAttribute("data-level");

      if (level === "all" || cardLevel === level) {
        card.classList.remove("hidden");
      } else {
        card.classList.add("hidden");
      }
    }
  }

  function openModal(id) {
    let selectedMovie = null;

    for (let i = 0; i < movies.length; i++) {
      if (movies[i].id === id) {
        selectedMovie = movies[i];
      }
    }

    if (selectedMovie === null) return;
    currentMovieId = id;

    // Применяем обложку с планом Б для модального окна
    setPosterWithFallback("modal-poster", selectedMovie);
    
    document.getElementById("modal-poster-title").textContent = selectedMovie.title;
    document.getElementById("modal-poster-year").textContent  = selectedMovie.year;

    document.getElementById("modal-title").textContent = selectedMovie.title;
    document.getElementById("modal-year").textContent  = selectedMovie.year;
    document.getElementById("modal-desc").textContent  = selectedMovie.desc;
    document.getElementById("modal-tip").innerHTML    = selectedMovie.tip;

    // Вывод предупреждения (если оно есть в объекте фильма)
    const warnContainer = document.getElementById("modal-warn");
    if (selectedMovie.warn && selectedMovie.warn !== "") {
      warnContainer.innerHTML = '<div class="modal-warn-tip">' + selectedMovie.warn + '</div>';
    } else {
      warnContainer.innerHTML = '';
    }

    const tag = document.getElementById("modal-level-tag");
    tag.textContent = selectedMovie.levelRu;
    if (selectedMovie.level === "beginner") {
      tag.className = "card-level-tag level-beginner";
    } else if (selectedMovie.level === "intermediate") {
      tag.className = "card-level-tag level-intermediate";
    } else if (selectedMovie.level === "advanced") {
      tag.className = "card-level-tag level-advanced";
    }

    updateWatchedButtonText();

    const iframe = document.getElementById("modal-video-iframe");
    const videoSection = document.getElementById("modal-video-section");
    
    if (selectedMovie.video !== "") {
      iframe.src = selectedMovie.video;
      videoSection.classList.add("visible");
    } else {
      iframe.src = "";
      videoSection.classList.remove("visible");
    }

    document.getElementById("modal").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeModal(event) {
    if (event === null || event.target === document.getElementById("modal")) {
      document.getElementById("modal").classList.remove("open");
      document.getElementById("modal-video-iframe").src = "";
      document.body.style.overflow = "";
    }
  }

  function toggleWatched() {
    for (let i = 0; i < movies.length; i++) {
      if (movies[i].id === currentMovieId) {
        movies[i].isWatched = !movies[i].isWatched;
      }
    }
    updateWatchedButtonText();
    renderCards();
  }

  function updateWatchedButtonText() {
    let isWatched = false;
    for (let i = 0; i < movies.length; i++) {
      if (movies[i].id === currentMovieId) {
        isWatched = movies[i].isWatched;
      }
    }

    const button = document.getElementById("modal-watched-btn");
    if (isWatched === true) {
      button.textContent = "✓ Просмотрено";
      button.classList.add("active");
    } else {
      button.textContent = "☐ Отметить просмотренным";
      button.classList.remove("active");
    }
  }

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      closeModal(null);
    }
  });

  renderCards();
</script>
